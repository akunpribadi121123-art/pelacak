<!DOCTYPE html>
<html>
<head>
    <title>Peta Pantauan Live</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>#map { height: 100vh; width: 100%; }</style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
    apiKey: "AIzaSyAQW4WSw-O2JYDnZfBciUPTVzm07rcsyXs",
    authDomain: "live-traker-e7ce2.firebaseapp.com",
    projectId: "live-traker-e7ce2",
    storageBucket: "live-traker-e7ce2.firebasestorage.app",
    messagingSenderId: "425874298746",
    appId: "1:425874298746:web:949db14ea30a1e742068c3",
    measurementId: "G-7PD74XWDSN"
  };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let marker;

        database.ref('live_location/target1').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const pos = [data.latitude, data.longitude];
                if (!marker) {
                    marker = L.marker(pos).addTo(map);
                    map.setView(pos, 16);
                } else {
                    marker.setLatLng(pos);
                }
            }
        });
    </script>
</body>
</html>
