<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Pemantau Live - Admin</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        .status-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            min-width: 200px;
        }
        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: gray;
            margin-right: 5px;
        }
        .online { background: #00ff00; box-shadow: 0 0 5px #00ff00; }
    </style>
</head>
<body>

    <div class="status-panel">
        <h3 style="margin: 0 0 10px 0; font-size: 16px;">Monitoring Live</h3>
        <p style="font-size: 14px; margin: 5px 0;">
            Status: <span id="indicator" class="indicator"></span> <span id="txt-status">Menunggu data...</span>
        </p>
        <p style="font-size: 12px; color: #666; margin: 0;">
            Akurasi: <span id="txt-acc">-</span> meter
        </p>
        <p style="font-size: 11px; color: #888; margin-top: 5px;" id="txt-time"></p>
    </div>

    <div id="map"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- KONFIGURASI FIREBASE ANDA ---
        const firebaseConfig = {
            apiKey: "AIzaSyAQW4WSw-O2JYDnZfBciUPTVzm07rcsyXs",
            authDomain: "live-traker-e7ce2.firebaseapp.com",
            projectId: "live-traker-e7ce2",
            storageBucket: "live-traker-e7ce2.firebasestorage.app",
            messagingSenderId: "425874298746",
            appId: "1:425874298746:web:949db14ea30a1e742068c3",
            measurementId: "G-7PD74XWDSN",
            databaseURL: "https://live-traker-e7ce2-default-rtdb.firebaseio.com"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Inisialisasi Peta
        // Set tampilan awal ke koordinat Indonesia secara umum
        const map = L.map('map').setView([-2.5489, 118.0149], 5);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker, circle;

        // Fungsi untuk mengupdate peta saat data masuk
        database.ref('live_location/target1').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data) {
                const lat = data.latitude;
                const lon = data.longitude;
                const acc = data.accuracy;
                const pos = [lat, lon];

                // Update UI Panel
                document.getElementById('indicator').classList.add('online');
                document.getElementById('txt-status').innerText = "Target Aktif";
                document.getElementById('txt-acc').innerText = Math.round(acc);
                document.getElementById('txt-time').innerText = "Update: " + new Date().toLocaleTimeString();

                // Update Marker dan Lingkaran Akurasi di Peta
                if (!marker) {
                    // Jika marker belum ada, buat baru
                    marker = L.marker(pos).addTo(map).bindPopup("Lokasi Target").openPopup();
                    circle = L.circle(pos, { radius: acc, color: 'blue', fillOpacity: 0.1 }).addTo(map);
                    map.setView(pos, 16); // Zoom otomatis ke target saat pertama muncul
                } else {
                    // Jika sudah ada, geser saja lokasinya (Live Share)
                    marker.setLatLng(pos);
                    circle.setLatLng(pos);
                    circle.setRadius(acc);
                    map.panTo(pos); // Mengikuti pergerakan target tanpa zoom ulang
                }
            }
        });
    </script>
</body>
</html>
