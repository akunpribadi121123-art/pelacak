<!DOCTYPE html>
<html>
<head>
    <title>Peta Pantau Live</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; background: #cbd5e1; }
        .panel { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 10px; border-radius: 8px; font-family: sans-serif; border: 2px solid #3b82f6; }
    </style>
</head>
<body>
    <div class="panel">
        <b>Status:</b> <span id="msg">Menghubungkan...</span>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQW4WSw-O2JYDnZfBciUPTVzm07rcsyXs",
            authDomain: "live-traker-e7ce2.firebaseapp.com",
            projectId: "live-traker-e7ce2",
            databaseURL: "https://live-traker-e7ce2-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        
        const map = L.map('map').setView([-2.5489, 118.0149], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let marker, circle;
        let polyline = L.polyline([], {color: 'red', weight: 4}).addTo(map);

        // MENGAMBIL DATA
        firebase.database().ref('live_location/target1').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data && data.lat && data.lon) {
                document.getElementById('msg').innerText = "Target Aktif 🟢";
                const koordinat = [data.lat, data.lon];

                // Tambah garis riwayat
                polyline.addLatLng(koordinat);

                if (!marker) {
                    marker = L.marker(koordinat).addTo(map).bindPopup("Posisi Target").openPopup();
                    circle = L.circle(koordinat, {radius: data.acc}).addTo(map);
                    map.setView(koordinat, 17);
                } else {
                    marker.setLatLng(koordinat);
                    circle.setLatLng(koordinat).setRadius(data.acc);
                    map.panTo(koordinat);
                }
            } else {
                document.getElementById('msg').innerText = "Menunggu data dari HP target... ⏳";
            }
        });
    </script>
</body>
</html>
